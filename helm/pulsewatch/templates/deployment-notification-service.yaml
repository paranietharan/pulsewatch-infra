apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulsewatch.fullname" . }}-notification-service
  labels:
    {{- include "pulsewatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
spec:
  replicas: {{ .Values.notificationService.replicaCount | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "pulsewatch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification-service
  template:
    metadata:
      labels:
        {{- include "pulsewatch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notification-service
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "pulsewatch.fullname" .) }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: notification-service
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: SMTP_FROM
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: FRONTEND_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: LOG_LEVEL
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
