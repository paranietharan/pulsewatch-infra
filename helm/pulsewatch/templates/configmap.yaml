apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulsewatch.fullname" . }}-config
  labels:
    {{- include "pulsewatch.labels" . | nindent 4 }}
data:
  # General & Logging
  ENVIRONMENT: {{ .Values.global.environment | default "production" | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | default "info" | quote }}
  FRONTEND_URL: {{ .Values.web.publicUrl | quote }}

  # API Service
  API_HOST: "0.0.0.0"
  API_PORT: "8080"
  CLIENT_IP_STRATEGY: {{ .Values.api.clientIpStrategy | default "proxy_hops" | quote }}
  CLIENT_IP_HEADER: {{ .Values.api.clientIpHeader | default "" | quote }}
  CLIENT_IP_TRUSTED_PROXIES: {{ .Values.api.clientIpTrustedProxies | default "1" | quote }}

  # Scheduler Service
  SCHEDULER_POLL_INTERVAL_SEC: {{ .Values.scheduler.pollIntervalSec | default "5" | quote }}
  SCHEDULER_BATCH_SIZE: {{ .Values.scheduler.batchSize | default "50" | quote }}

  # Probe Worker Service
  PROBE_WORKER_CONCURRENCY: {{ .Values.probeWorker.concurrency | default "20" | quote }}
  PROBE_WORKER_PREFETCH: {{ .Values.probeWorker.prefetch | default "20" | quote }}
  PROBE_REGION: {{ .Values.probeWorker.region | default "aws-eks" | quote }}
  ALLOW_INTERNAL_PROBES: {{ .Values.probeWorker.allowInternalProbes | default "false" | quote }}

  # Notification Service
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_FROM: {{ .Values.smtp.from | quote }}

  # Web Dashboard Frontend
  NEXT_PUBLIC_API_BASE_URL: {{ .Values.api.publicUrl | quote }}
  INTERNAL_API_URL: {{ printf "http://%s-api:8080" (include "pulsewatch.fullname" .) | quote }}
  PORT: "3000"
