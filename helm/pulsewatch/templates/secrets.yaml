apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulsewatch.fullname" . }}-secrets
  labels:
    {{- include "pulsewatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "pulsewatch.databaseUrl" . | quote }}
  RABBITMQ_URL: {{ include "pulsewatch.rabbitmqUrl" . | quote }}
  JWT_SECRET: {{ .Values.api.jwtSecret | quote }}
  SMTP_USER: {{ .Values.smtp.user | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.smtp.password | default "" | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.auth.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.auth.password | quote }}
