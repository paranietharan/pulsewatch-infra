apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulsewatch.fullname" . }}-api
  labels:
    {{- include "pulsewatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.api.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pulsewatch.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
