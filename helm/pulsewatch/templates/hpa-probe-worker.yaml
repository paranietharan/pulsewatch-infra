{{- if .Values.probeWorker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "pulsewatch.fullname" . }}-probe-worker
  labels:
    {{- include "pulsewatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: probe-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "pulsewatch.fullname" . }}-probe-worker
  minReplicas: {{ .Values.probeWorker.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ .Values.probeWorker.autoscaling.maxReplicas | default 10 }}
  metrics:
    {{- if .Values.probeWorker.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.probeWorker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.probeWorker.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.probeWorker.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
