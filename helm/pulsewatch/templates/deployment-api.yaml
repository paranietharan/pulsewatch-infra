apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulsewatch.fullname" . }}-api
  labels:
    {{- include "pulsewatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "pulsewatch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "pulsewatch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "pulsewatch.fullname" .) }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-secrets
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: API_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: API_HOST
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: API_PORT
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: LOG_LEVEL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: FRONTEND_URL
            - name: CLIENT_IP_STRATEGY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: CLIENT_IP_STRATEGY
            - name: CLIENT_IP_HEADER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: CLIENT_IP_HEADER
            - name: CLIENT_IP_TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulsewatch.fullname" . }}-config
                  key: CLIENT_IP_TRUSTED_PROXIES
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
