# ==============================================================================
# Production Environment Overlays
# Merged on top of values.yaml for namespace: production
# Follows DRY best practices: contains ONLY environment-specific deltas
# ==============================================================================

global:
  environment: "production"
  logLevel: "info"
database:
  host: "pulsewatch-eks-postgres.cfy4e4ssuvgk.ap-south-1.rds.amazonaws.com"
  dbName: "pulsewatch"
  sslmode: "require"
# ------------------------------------------------------------------------------
# Production Microservice Sizing (Optimized for Free/Cost-Effective EKS cluster)
# ------------------------------------------------------------------------------
api:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-api
    tag: fd81fc5
web:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-web
    tag: fd81fc5
probeWorker:
  replicaCount: 1
  concurrency: 15
  prefetch: 15
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-probe-worker
    tag: fd81fc5
notificationService:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-notification-service
    tag: fd81fc5
scheduler:
  replicaCount: 1
  pollIntervalSec: 5
  batchSize: 50
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-scheduler
    tag: fd81fc5
rabbitmq:
  persistence:
    size: "2Gi"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
# ------------------------------------------------------------------------------
# Production Ingress & ALB Group
# ------------------------------------------------------------------------------
ingress:
  annotations:
    alb.ingress.kubernetes.io/group.name: "pulsewatch-production-alb"
migrator:
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-db-migrator
    tag: fd81fc5
