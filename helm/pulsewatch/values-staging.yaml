# ==============================================================================
# Staging Environment Overlays
# Merged on top of values.yaml for namespace: staging
# Follows DRY best practices: contains ONLY environment-specific deltas
# ==============================================================================

global:
  environment: "staging"
  logLevel: "debug"
database:
  host: "pulsewatch-eks-postgres.cfy4e4ssuvgk.ap-south-1.rds.amazonaws.com"
  dbName: "pulsewatch_staging"
  sslmode: "require"
# ------------------------------------------------------------------------------
# Staging Microservice Sizing (Cost-optimized profile)
# ------------------------------------------------------------------------------
api:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-api
    tag: fd81fc5
web:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-web
    tag: fd81fc5
probeWorker:
  replicaCount: 1
  concurrency: 10
  prefetch: 10
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-probe-worker
    tag: fd81fc5
notificationService:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-notification-service
    tag: fd81fc5
scheduler:
  replicaCount: 1
  pollIntervalSec: 10
  batchSize: 20
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-scheduler
    tag: fd81fc5
rabbitmq:
  persistence:
    size: "2Gi"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
# ------------------------------------------------------------------------------
# Staging Ingress & ALB Group
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/group.name: "pulsewatch-staging-alb"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
  hosts:
    - paths:
        - path: "/api"
          pathType: "Prefix"
          service: "api"
          port: 8080
        - path: "/"
          pathType: "Prefix"
          service: "web"
          port: 80
migrator:
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-db-migrator
    tag: fd81fc5
