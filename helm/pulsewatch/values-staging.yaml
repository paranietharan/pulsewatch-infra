# ==============================================================================
# Staging Environment Overlays
# Merged on top of values.yaml for namespace: staging
# Follows DRY best practices: contains ONLY environment-specific deltas
# ==============================================================================

global:
  environment: "staging"
  logLevel: "debug"

database:
  dbName: "pulsewatch_staging"

# ------------------------------------------------------------------------------
# Staging Microservice Sizing (Cost-optimized profile)
# ------------------------------------------------------------------------------
api:
  replicaCount: 1
  publicUrl: "https://api.staging.pulsewatch.example.com"
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  replicaCount: 1
  publicUrl: "https://staging.pulsewatch.example.com"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

probeWorker:
  replicaCount: 1
  concurrency: 10
  prefetch: 10
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

notificationService:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

scheduler:
  replicaCount: 1
  pollIntervalSec: 10
  batchSize: 20
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

rabbitmq:
  persistence:
    size: "5Gi"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ------------------------------------------------------------------------------
# Staging Ingress & ALB Group
# ------------------------------------------------------------------------------
ingress:
  annotations:
    alb.ingress.kubernetes.io/group.name: "pulsewatch-staging-alb"
  hosts:
    - host: "staging.pulsewatch.example.com"
      paths:
        - path: "/"
          pathType: "Prefix"
          service: "web"
          port: 80
    - host: "api.staging.pulsewatch.example.com"
      paths:
        - path: "/"
          pathType: "Prefix"
          service: "api"
          port: 8080
