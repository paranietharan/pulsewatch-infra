# ==============================================================================
# Staging Environment Overlays
# Merged on top of values.yaml for namespace: staging
# Follows DRY best practices: contains ONLY environment-specific deltas
# ==============================================================================

global:
  environment: "staging"
  logLevel: "debug"
database:
  dbName: "pulsewatch_staging"
# ------------------------------------------------------------------------------
# Staging Microservice Sizing (Cost-optimized profile)
# ------------------------------------------------------------------------------
api:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-api
    tag: 3ffa170
web:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-web
    tag: 3ffa170
probeWorker:
  replicaCount: 1
  concurrency: 10
  prefetch: 10
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-probe-worker
    tag: 3ffa170
notificationService:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-notification-service
    tag: 3ffa170
scheduler:
  replicaCount: 1
  pollIntervalSec: 10
  batchSize: 20
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-scheduler
    tag: 3ffa170
rabbitmq:
  persistence:
    size: "2Gi"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
# ------------------------------------------------------------------------------
# Staging Ingress & ALB Group
# ------------------------------------------------------------------------------
ingress:
  annotations:
    alb.ingress.kubernetes.io/group.name: "pulsewatch-staging-alb"
migrator:
  image:
    repository: 300052334721.dkr.ecr.ap-south-1.amazonaws.com/pulsewatch-db-migrator
    tag: 3ffa170
