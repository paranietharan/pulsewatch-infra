name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [terraform, terraform/backend_setup]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v4.3.1
      - run: |
          for values in values.yaml values-staging.yaml values-prod.yaml; do
            args=()
            if [[ "$values" == values-prod.yaml ]]; then
              for component in api web scheduler probeWorker notificationService migrator; do
                args+=(--set-string "$component.image.digest=sha256:$(printf '%064d' 1)")
              done
            fi
            helm lint helm/pulsewatch -f "helm/pulsewatch/$values" "${args[@]}"
            helm template ci helm/pulsewatch -f "helm/pulsewatch/$values" "${args[@]}" >/dev/null
          done
