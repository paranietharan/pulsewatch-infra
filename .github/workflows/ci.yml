name: Infrastructure CI (Terraform & Helm Lint)

on:
  pull_request:

jobs:
  validate-terraform:
    name: Validate Terraform Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  validate-helm:
    name: Lint & Template Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart (Base Defaults)
        run: helm lint ./helm/pulsewatch

      - name: Lint Helm Chart (Staging Values)
        run: helm lint ./helm/pulsewatch -f ./helm/pulsewatch/values-staging.yaml

      - name: Lint Helm Chart (Production Values)
        run: helm lint ./helm/pulsewatch -f ./helm/pulsewatch/values-prod.yaml

      - name: Render Staging Template
        run: |
          helm template pulsewatch-staging ./helm/pulsewatch \
            --namespace staging \
            -f ./helm/pulsewatch/values.yaml \
            -f ./helm/pulsewatch/values-staging.yaml > /dev/null
          echo "Staging template rendered successfully."

      - name: Render Production Template
        run: |
          helm template pulsewatch-production ./helm/pulsewatch \
            --namespace production \
            -f ./helm/pulsewatch/values.yaml \
            -f ./helm/pulsewatch/values-prod.yaml > /dev/null
          echo "Production template rendered successfully."
