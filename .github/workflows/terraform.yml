name: Terraform Infrastructure (AWS EKS & Cloud)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform Action to execute"
        required: true
        type: choice
        default: "plan"
        options:
          - plan
          - apply

env:
  AWS_REGION: ap-south-1

jobs:
  terraform:
    name: Terraform Run
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Ensure & Resolve S3 State Backend
        id: config
        working-directory: terraform
        run: |
          ACTION="${{ github.event.inputs.action }}"

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="pulsewatch-tf-state-${ACCOUNT_ID}"

          echo "Selected Action: $ACTION"
          echo "Using S3 State Bucket: $BUCKET"

          # Automatically create S3 remote state bucket if not present
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Creating S3 bucket '$BUCKET' in region '${{ env.AWS_REGION }}'..."
            aws s3api create-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          else
            echo "S3 state bucket '$BUCKET' already exists."
          fi

          # Automatically create DynamoDB lock table if not present
          if ! aws dynamodb describe-table --table-name pulsewatch-terraform-locks --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Creating DynamoDB table 'pulsewatch-terraform-locks'..."
            aws dynamodb create-table \
              --table-name pulsewatch-terraform-locks \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }}
            aws dynamodb wait table-exists --table-name pulsewatch-terraform-locks --region ${{ env.AWS_REGION }}
          else
            echo "DynamoDB lock table 'pulsewatch-terraform-locks' already exists."
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Terraform Init (S3 Backend & DynamoDB Locking)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.config.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=pulsewatch-terraform-locks" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: ${{ steps.config.outputs.action == 'apply' }}
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Post Execution Summary
        working-directory: terraform
        run: |
          echo "### 🌍 Terraform Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: \`${{ steps.config.outputs.action }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **State Bucket**: \`${{ steps.config.outputs.bucket }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lock Table**: \`pulsewatch-terraform-locks\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
